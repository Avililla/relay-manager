enablePrePostScripts: true

# pnpm >= 10.26 / 11 / 12
allowBuilds:
  '@prisma/engines': true
  '@serialport/bindings-cpp': true
  better-sqlite3: true
  # ssh2 (Archivos › Enviar a equipo) is pure JavaScript: its optional native speed-ups (cpu-features and the
  # sshcrypto binding) are never built, so the offline bundle has no compiled code of theirs.
  cpu-features: false
  esbuild: true
  prisma: true
  sharp: true
  ssh2: false
  unrs-resolver: true

# pnpm < 10.26
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@serialport/bindings-cpp'
  - better-sqlite3
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# pnpm < 10.26: the same two, explicitly not built.
ignoredBuiltDependencies:
  - cpu-features
  - ssh2
